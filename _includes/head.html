<!--
HTML head section template for Jekyll site pages

This partial template defines the common HTML head elements for all pages:
- Sets character encoding, IE compatibility, and responsive viewport
- Dynamically generates page titles using Jekyll variables (page.title or site.title)
- Creates meta descriptions from page excerpts or site description
- Links to main CSS stylesheet with site baseurl prepending
- Sets canonical URL for SEO purposes
- Provides RSS feed link for content syndication

Usage: Include this template in layout files using {% include head.html %}
Dependencies: Requires Jekyll site and page variables (site.title, site.baseurl, site.url, page.title, page.excerpt)
-->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">
</head>
